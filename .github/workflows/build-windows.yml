name: Build Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: disparo-em-massa/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./disparo-em-massa

      - name: Build and publish Windows installer
        # electron-builder já publica direto no GitHub Release quando roda numa tag com
        # GH_TOKEN presente (build.publish em package.json) — inclui .exe, .blockmap e
        # latest.yml, os três arquivos que o electron-updater precisa pra funcionar. Um passo
        # manual de release separado ficaria sem o latest.yml/blockmap e quebraria o auto-update.
        run: npx electron-builder --win --publish always
        working-directory: ./disparo-em-massa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: disparo-em-massa/dist/*.exe
          retention-days: 7