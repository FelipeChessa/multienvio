<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>MultiEnvio — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand: #16a34a; --brand-dark: #065f46; --brand-light: #22c55e;
    --ink: #0f172a; --ink-soft: #334155; --muted: #64748b;
    --surface: #ffffff; --surface-alt: #f8fafc; --bg: #eef1f5; --border: #e2e8f0;
    --danger: #dc2626; --danger-bg: #fef2f2; --warning: #b45309; --warning-bg: #fffbeb;
    --font-heading: 'Sora', 'Segoe UI', Arial, sans-serif;
    --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--ink); }
  h1, h2 { font-family: var(--font-heading); letter-spacing: -0.01em; }
  header { background: linear-gradient(120deg, #0b1220, #16233a 55%, #0f3d33 130%); color: white; padding: 18px 24px; }
  header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 14px 24px; }
  header h1 { font-size: 17px; margin: 0; }
  header nav { display: flex; gap: 6px; }
  header nav a { color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
  header nav a.active, header nav a:hover { background: rgba(255,255,255,.1); color: white; }
  /* usa a tela inteira: a tabela de ativações tem muitas colunas */
  main { max-width: 1440px; margin: 0 auto; padding: 24px 32px 60px; }
  .card-form { max-width: 760px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
  .card h2 { font-size: 16px; margin: 0 0 16px; }
  label { display: block; font-weight: 600; font-size: 13px; color: var(--ink-soft); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="number"], input[type="search"], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--font-body); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(22,163,74,.14); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  button { font-family: var(--font-heading); font-weight: 700; font-size: 13.5px; cursor: pointer; border-radius: 8px; }
  .btn-primary {
    background: linear-gradient(135deg, var(--brand-light), var(--brand-dark)); color: white; border: none;
    padding: 11px 20px; margin-top: 16px;
  }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .btn-secondary { background: var(--surface-alt); color: var(--ink-soft); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; padding: 6px 12px; font-size: 12px; }
  .result-box {
    margin-top: 16px; padding: 14px; background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 8px; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; word-break: break-all;
    display: none;
  }
  .result-box.visible { display: block; }
  .notice { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
  .notice.visible { display: block; }
  .notice.error { background: var(--danger-bg); color: var(--danger); }
  .notice.success { background: #f0fdf4; color: var(--brand-dark); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  td.actions { display: flex; gap: 6px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .status-badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .status-badge.ativa { background: #f0fdf4; color: var(--brand-dark); }
  .status-badge.expirada { background: var(--warning-bg); color: var(--warning); }
  .status-badge.revogada { background: var(--danger-bg); color: var(--danger); }
  /* filtros da tabela de ativações */
  .act-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .act-head h2 { margin: 0; }
  .act-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .act-filters input[type="search"] { flex: 1 1 280px; max-width: 420px; margin: 0; }
  .act-filters select { width: auto; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--surface-alt); color: var(--ink-soft); border: 1px solid var(--border); padding: 6px 12px; font-size: 12.5px; border-radius: 999px; }
  .chip b { font-weight: 800; margin-left: 4px; color: var(--muted); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.active b { color: #cbd5e1; }
  .act-count { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th .arrow { font-size: 10px; margin-left: 3px; }
  tbody tr:hover td { background: var(--surface-alt); }
  td.actions { display: flex; gap: 6px; justify-content: flex-end; }
  .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #cbd5e1; vertical-align: middle; }
  .dot.on { background: var(--brand-light); }
  .status-badge.vencendo { background: #fff7ed; color: #c2410c; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid transparent; padding: 6px 10px; font-size: 12px; }
  .btn-ghost:hover { border-color: var(--border); background: var(--surface); }
  .gate { max-width: 380px; margin: 60px auto; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <header>
    <h1>MultiEnvio — Painel Admin</h1>
    <nav>
      <a href="/admin/" class="active">Licenças</a>
      <a href="/admin/contratos/">Contratos</a>
    </nav>
  </header>

  <main>
    <section id="gate" class="card gate">
      <h2>Entrar</h2>
      <label for="token-input">Senha de admin (ADMIN_TOKEN)</label>
      <input type="password" id="token-input" placeholder="Cole sua senha de admin" autocomplete="off" />
      <div class="checkbox-row">
        <input type="checkbox" id="remember-token" checked />
        <label for="remember-token" style="margin:0;font-weight:400;">Lembrar neste navegador</label>
      </div>
      <button class="btn-primary" id="unlock-btn" style="width:100%;">Entrar</button>
      <p id="gate-error" class="notice error"></p>
    </section>

    <div id="panel" class="hidden">
      <section class="card card-form">
        <h2>Gerar nova chave de licença</h2>
        <label for="customer-name">Nome do cliente</label>
        <input type="text" id="customer-name" placeholder="Ex: Padaria do João" />
        <label for="expiry-days">Validade em dias (deixe em branco para vitalícia)</label>
        <input type="number" id="expiry-days" min="1" placeholder="Vitalícia" />
        <button class="btn-primary" id="generate-btn">Gerar chave</button>
        <p id="generate-error" class="notice error"></p>
        <div id="generate-result" class="result-box"></div>
      </section>

      <section class="card">
        <div class="act-head">
          <h2>Ativações</h2>
          <button class="btn-secondary" id="refresh-btn">Atualizar</button>
        </div>
        <div class="act-filters">
          <input type="search" id="act-search" placeholder="Buscar por cliente, computador ou chave…" autocomplete="off">
          <div class="chips" id="act-chips"></div>
        </div>
        <p class="act-count" id="act-count"></p>
        <p id="activations-empty" class="empty hidden">Nenhuma ativação registrada ainda.</p>
        <div style="overflow-x:auto;">
          <table id="activations-table" class="hidden">
            <thead>
              <tr>
                <th class="sortable" data-sort="customer">Cliente</th>
                <th>Computador</th>
                <th class="sortable" data-sort="since">Desde</th>
                <th class="sortable" data-sort="expires">Expira em</th>
                <th class="sortable" data-sort="seen" title="Última vez que o programa do cliente esteve aberto e conferiu a licença (versão 1.6.4 ou mais nova). Precisão de uns 10 minutos.">Último uso</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="activations-body"></tbody>
          </table>
        </div>
      </section>

      <button class="btn-secondary" id="logout-btn">Sair / trocar senha</button>
    </div>
  </main>

<script>
  const gate = document.getElementById('gate')
  const panel = document.getElementById('panel')
  const tokenInput = document.getElementById('token-input')
  const rememberCheckbox = document.getElementById('remember-token')
  const unlockBtn = document.getElementById('unlock-btn')
  const gateError = document.getElementById('gate-error')

  let adminToken = null

  function showNotice(el, text, type) {
    el.textContent = text
    el.className = 'notice visible ' + type
  }
  function hideNotice(el) {
    el.className = 'notice'
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken, ...(options.headers || {}) }
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.error || 'Erro na requisição.')
    return data
  }

  async function tryUnlock(token) {
    adminToken = token
    try {
      await apiFetch('/api/admin/activations')
      gate.classList.add('hidden')
      panel.classList.remove('hidden')
      if (rememberCheckbox.checked) localStorage.setItem('adminToken', token)
      loadActivations()
    } catch (err) {
      adminToken = null
      showNotice(gateError, 'Senha incorreta ou servidor indisponível.', 'error')
    }
  }

  unlockBtn.addEventListener('click', () => {
    hideNotice(gateError)
    const token = tokenInput.value.trim()
    if (!token) return showNotice(gateError, 'Digite a senha de admin.', 'error')
    tryUnlock(token)
  })
  tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockBtn.click() })

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('adminToken')
    adminToken = null
    panel.classList.add('hidden')
    gate.classList.remove('hidden')
    tokenInput.value = ''
  })

  // tenta usar o token salvo no navegador, se tiver
  const savedToken = localStorage.getItem('adminToken')
  if (savedToken) tryUnlock(savedToken)

  // gerar chave
  const generateBtn = document.getElementById('generate-btn')
  const generateError = document.getElementById('generate-error')
  const generateResult = document.getElementById('generate-result')

  generateBtn.addEventListener('click', async () => {
    hideNotice(generateError)
    generateResult.className = 'result-box'
    const customerName = document.getElementById('customer-name').value.trim()
    const expiryDays = document.getElementById('expiry-days').value.trim()
    if (!customerName) return showNotice(generateError, 'Digite o nome do cliente.', 'error')

    generateBtn.disabled = true
    generateBtn.textContent = 'Gerando...'
    try {
      const data = await apiFetch('/api/admin/generate-license', {
        method: 'POST',
        body: JSON.stringify({ customerName, expiryDays: expiryDays ? Number(expiryDays) : null })
      })
      const validade = data.expiresAt ? new Date(data.expiresAt).toLocaleDateString('pt-BR') : 'vitalícia'
      generateResult.innerHTML =
        '<strong>Cliente:</strong> ' + customerName + '<br>' +
        '<strong>Validade:</strong> ' + validade + '<br><br>' +
        '<strong>Chave:</strong><br>' + data.key +
        '<br><br><button class="btn-secondary" id="copy-key-btn" type="button">Copiar chave</button>'
      generateResult.className = 'result-box visible'
      document.getElementById('copy-key-btn').addEventListener('click', (e) => {
        navigator.clipboard.writeText(data.key)
        e.target.textContent = 'Copiado!'
        setTimeout(() => { e.target.textContent = 'Copiar chave' }, 1500)
      })
      document.getElementById('customer-name').value = ''
      document.getElementById('expiry-days').value = ''
    } catch (err) {
      showNotice(generateError, err.message, 'error')
    }
    generateBtn.disabled = false
    generateBtn.textContent = 'Gerar chave'
  })

  // lista de ativações
  const refreshBtn = document.getElementById('refresh-btn')
  const activationsEmpty = document.getElementById('activations-empty')
  const activationsTable = document.getElementById('activations-table')
  const activationsBody = document.getElementById('activations-body')

  // ----- Ativações: busca, filtro por status e ordenação, tudo na tela (sem recarregar) -----
  const DAY = 24 * 60 * 60 * 1000
  const STATUS_LABELS = { ativa: 'Ativa', vencendo: 'Vence logo', expirada: 'Expirada', revogada: 'Revogada' }
  const FILTERS = [
    { id: 'todas', label: 'Todas' },
    { id: 'ativa', label: 'Ativas' },
    { id: 'vencendo', label: 'Vencem em 7 dias' },
    { id: 'expirada', label: 'Expiradas' },
    { id: 'revogada', label: 'Revogadas' }
  ]
  const actState = { rows: [], filter: 'todas', search: '', sort: 'since', dir: -1 }
  const actSearch = document.getElementById('act-search')
  const actChips = document.getElementById('act-chips')
  const actCount = document.getElementById('act-count')

  // "vencendo": ativa e expira nos próximos 7 dias (entra também no filtro "Ativas")
  function rowStatus(info) {
    const base = info.status || (info.revoked ? 'revogada' : 'ativa')
    if (base === 'ativa' && info.expiresAt && new Date(info.expiresAt).getTime() - Date.now() < 7 * DAY) return 'vencendo'
    return base
  }

  function timeAgo(iso) {
    if (!iso) return null
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000)
    if (min < 1) return 'agora'
    if (min < 60) return 'há ' + min + ' min'
    const h = Math.round(min / 60)
    if (h < 24) return 'há ' + h + ' h'
    const d = Math.round(h / 24)
    return 'há ' + d + (d === 1 ? ' dia' : ' dias')
  }

  function fmtDate(iso) {
    return iso ? new Date(iso).toLocaleDateString('pt-BR') : '-'
  }

  function sortValue(row) {
    const i = row.info
    if (actState.sort === 'customer') return (i.customer || '').toLocaleLowerCase('pt-BR')
    if (actState.sort === 'expires') return i.expiresAt ? new Date(i.expiresAt).getTime() : Infinity
    if (actState.sort === 'seen') return i.lastSeenAt ? new Date(i.lastSeenAt).getTime() : 0
    return i.firstActivatedAt ? new Date(i.firstActivatedAt).getTime() : 0
  }

  function renderChips() {
    const counts = { todas: actState.rows.length, ativa: 0, vencendo: 0, expirada: 0, revogada: 0 }
    for (const r of actState.rows) {
      counts[r.status]++
      if (r.status === 'vencendo') counts.ativa++
    }
    actChips.innerHTML = ''
    for (const f of FILTERS) {
      const b = document.createElement('button')
      b.type = 'button'
      b.className = 'chip' + (actState.filter === f.id ? ' active' : '')
      b.innerHTML = escapeHtml(f.label) + '<b>' + counts[f.id] + '</b>'
      b.addEventListener('click', () => { actState.filter = f.id; renderActivations() })
      actChips.appendChild(b)
    }
  }

  function renderActivations() {
    renderChips()
    document.querySelectorAll('th.sortable').forEach((th) => {
      const on = th.dataset.sort === actState.sort
      th.querySelector('.arrow')?.remove()
      if (on) th.insertAdjacentHTML('beforeend', '<span class="arrow">' + (actState.dir > 0 ? '▲' : '▼') + '</span>')
    })

    const q = actState.search.trim().toLocaleLowerCase('pt-BR')
    const rows = actState.rows
      .filter((r) => actState.filter === 'todas' || r.status === actState.filter || (actState.filter === 'ativa' && r.status === 'vencendo'))
      .filter((r) => !q || [r.info.customer, r.info.deviceId, r.key].some((v) => (v || '').toLocaleLowerCase('pt-BR').includes(q)))
      .sort((a, b) => {
        const va = sortValue(a)
        const vb = sortValue(b)
        return (va < vb ? -1 : va > vb ? 1 : 0) * actState.dir
      })

    actCount.textContent = rows.length === actState.rows.length
      ? actState.rows.length + ' ativações'
      : 'Mostrando ' + rows.length + ' de ' + actState.rows.length
    activationsBody.innerHTML = ''
    if (rows.length === 0) {
      activationsBody.innerHTML = '<tr><td colspan="7" class="empty">Nenhuma ativação com esse filtro.</td></tr>'
      return
    }

    for (const { key, info, status } of rows) {
      const tr = document.createElement('tr')
      const daysLeft = info.expiresAt ? Math.ceil((new Date(info.expiresAt).getTime() - Date.now()) / DAY) : null
      const expiresSub = daysLeft === null ? '' : daysLeft >= 0 ? (daysLeft === 0 ? 'vence hoje' : 'faltam ' + daysLeft + (daysLeft === 1 ? ' dia' : ' dias')) : ''
      const seen = timeAgo(info.lastSeenAt)
      const online = info.lastSeenAt && Date.now() - new Date(info.lastSeenAt).getTime() < 20 * 60000
      tr.innerHTML =
        '<td><strong>' + escapeHtml(info.customer || '-') + '</strong></td>' +
        '<td><span class="mono" title="' + escapeHtml(info.deviceId || '') + '">' + escapeHtml((info.deviceId || '-').slice(0, 13)) + (info.deviceId ? '…' : '') + '</span></td>' +
        '<td>' + fmtDate(info.firstActivatedAt) + '</td>' +
        '<td>' + (info.expiresAt ? fmtDate(info.expiresAt) : 'Vitalícia') + (expiresSub ? '<span class="sub">' + expiresSub + '</span>' : '') + '</td>' +
        '<td title="' + escapeHtml(info.lastSeenAt ? new Date(info.lastSeenAt).toLocaleString('pt-BR') : 'Nunca conferiu: programa antigo (até 1.6.3) ou fechado desde a ativação') + '">' +
          (info.lastSeenAt
            ? '<span class="dot' + (online ? ' on' : '') + '"></span>' + new Date(info.lastSeenAt).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + '<span class="sub">' + (online ? 'usando agora' : seen) + '</span>'
            : '<span class="dot"></span>Nunca<span class="sub">versão antiga ou não abriu</span>') + '</td>' +
        '<td><span class="status-badge ' + status + '">' + STATUS_LABELS[status] + '</span>' +
          (info.revokedAt ? '<span class="sub">em ' + fmtDate(info.revokedAt) + '</span>' : '') + '</td>' +
        '<td class="actions"></td>'
      const actionsCell = tr.querySelector('.actions')

      const copyBtn = document.createElement('button')
      copyBtn.className = 'btn-ghost'
      copyBtn.textContent = 'Copiar chave'
      copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(key)
        copyBtn.textContent = 'Copiada ✓'
        setTimeout(() => { copyBtn.textContent = 'Copiar chave' }, 1500)
      })
      actionsCell.appendChild(copyBtn)

      // reset apaga o registro: libera para outro computador e também desfaz uma revogação
      const resetBtn = document.createElement('button')
      resetBtn.className = 'btn-secondary'
      resetBtn.textContent = info.revoked ? 'Reativar' : 'Liberar p/ outro PC'
      resetBtn.addEventListener('click', () => {
        const msg = info.revoked
          ? 'Reativar a chave de "' + (info.customer || '-') + '"? O programa do cliente volta a funcionar na próxima conferência.'
          : 'Liberar a chave de "' + (info.customer || '-') + '" para outro computador? O computador atual trava assim que outro ativar.'
        if (confirm(msg)) doAction('/api/admin/reset', key, resetBtn)
      })
      actionsCell.appendChild(resetBtn)

      if (!info.revoked) {
        const revokeBtn = document.createElement('button')
        revokeBtn.className = 'btn-danger'
        revokeBtn.textContent = 'Revogar'
        revokeBtn.addEventListener('click', () => {
          if (confirm('Revogar a chave de "' + (info.customer || '-') + '"? O programa do cliente trava no próximo clique ou em até 5 minutos.')) {
            doAction('/api/admin/revoke', key, revokeBtn)
          }
        })
        actionsCell.appendChild(revokeBtn)
      }

      activationsBody.appendChild(tr)
    }
  }

  async function loadActivations() {
    try {
      const data = await apiFetch('/api/admin/activations')
      actState.rows = Object.entries(data).map(([key, info]) => ({ key, info, status: rowStatus(info) }))
      if (actState.rows.length === 0) {
        activationsTable.classList.add('hidden')
        activationsEmpty.classList.remove('hidden')
        actCount.textContent = ''
        actChips.innerHTML = ''
        return
      }
      activationsEmpty.classList.add('hidden')
      activationsTable.classList.remove('hidden')
      renderActivations()
    } catch (err) {
      // painel informativo — silencioso se der erro pontual
    }
  }

  actSearch.addEventListener('input', () => { actState.search = actSearch.value; renderActivations() })
  document.querySelectorAll('th.sortable').forEach((th) => {
    th.addEventListener('click', () => {
      if (actState.sort === th.dataset.sort) actState.dir *= -1
      else { actState.sort = th.dataset.sort; actState.dir = th.dataset.sort === 'customer' || th.dataset.sort === 'expires' ? 1 : -1 }
      renderActivations()
    })
  })

  async function doAction(path, key, btn) {
    btn.disabled = true
    try {
      await apiFetch(path, { method: 'POST', body: JSON.stringify({ key }) })
      loadActivations()
    } catch (err) {
      alert(err.message)
      btn.disabled = false
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div')
    div.textContent = str
    return div.innerHTML
  }

  refreshBtn.addEventListener('click', loadActivations)
</script>
</body>
</html>
